name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Direct Google Play browser client
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JavaScript syntax
        run: |
          node --check assets/play-client.js
          node --check assets/app.js

      - name: FDFE protobuf unit tests
        run: node --test tests/play-client.test.cjs

      - name: Static Pages files
        run: |
          test -s index.html
          test -s assets/app.css
          test -s assets/app.js
          test -s assets/play-client.js
          test -f .nojekyll

      - name: Direct Google Play contract
        run: |
          grep -q 'DIRECT GOOGLE PLAY FDFE' index.html
          grep -q 'android.clients.google.com/fdfe' assets/play-client.js
          grep -q 'https://auroraoss.com/api/auth' assets/play-client.js
          grep -q 'https://corsproxy.io/' assets/play-client.js
          grep -q 'cdn.jsdelivr.net/npm/jszip@3.10.1' index.html
          ! grep -R -E 'APKCombo|apkcombo\.com|APKPure|apkpure\.com|APKMirror|apkmirror\.com' assets README.md NOTICE

      - name: No server architecture
        run: |
          test ! -e backend
          test ! -e docker-compose.yml
          test ! -e .github/workflows/backend-image.yml
          ! grep -R -E 'FastAPI|uvicorn|/api/resolve-fast|playDownloaderBackend' index.html assets README.md

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static browser client
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JavaScript syntax
        run: |
          node --check assets/provider-apkcombo.js
          node --check assets/app.js

      - name: Provider parser tests
        run: node --test tests/provider.test.cjs

      - name: Static Pages contract
        run: |
          test -s index.html
          test -s assets/app.css
          test -s assets/app.js
          test -s assets/provider-apkcombo.js
          test -f .nojekyll
          grep -q '100% STATIC' index.html
          grep -q 'APKComboProvider' assets/app.js
          grep -q 'https://apkcombo.com' assets/provider-apkcombo.js
          grep -q 'https://corsproxy.io/' assets/provider-apkcombo.js
          grep -q 'cdn.jsdelivr.net/npm/jszip@3.10.1' index.html

      - name: No server architecture
        run: |
          test ! -e backend
          test ! -e docker-compose.yml
          test ! -e .github/workflows/backend-image.yml
          ! grep -R -E 'FastAPI|uvicorn|/api/resolve-fast|playDownloaderBackend' index.html assets README.md

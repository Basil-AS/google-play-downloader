name: Verify web app

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check required files
        run: |
          test -f index.html
          test -f api-patch.js
          test -f js/play-client.js
          test -f tests/play-client-runtime.cjs
          test -f js/common.js
          test -f js/render.js
          test -f js/actions.js
          test -f js/main.js
          test -f worker/site-worker.js
          test -f wrangler.jsonc
          test -f LICENSE
          test -f NOTICE
      - name: Verify browser/test protocol core are identical
        run: cmp js/play-client.js tests/play-client-runtime.cjs
      - name: Check JavaScript syntax
        run: |
          node --check api-patch.js
          node --check js/play-client.js
          node --check tests/play-client-runtime.cjs
          node --check js/common.js
          node --check js/render.js
          node --check js/actions.js
          node --check js/main.js
          node --check worker/site-worker.js
          node --check scripts/build.mjs
      - name: Unit tests
        run: node --test tests/play-client.test.cjs tests/worker.test.mjs
      - name: Verify transport contract
        run: |
          grep -q 'google-play-downloader.basil-as.workers.dev' api-patch.js
          grep -q '/api/fdfe' api-patch.js
          grep -q '/api/aurora-auth' worker/site-worker.js
          grep -q 'play.googleapis.com' worker/site-worker.js
          ! grep -R -nE 'APKCombo|APKPure|APKMirror' index.html js api-patch.js worker || exit 1
      - name: Build static assets
        run: node scripts/build.mjs
      - name: Verify build output
        run: |
          test -f dist/index.html
          test -f dist/api-patch.js
          test -f dist/js/play-client.js
          test -f dist/js/main.js
          test -f dist/css/base.css
          test -f dist/css/components.css

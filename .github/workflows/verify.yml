name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python + frontend + compose
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pytest

      - name: Python syntax and import smoke test
        env:
          PYTHONPATH: backend
        run: |
          python -m py_compile backend/app.py backend/fast_app.py
          python - <<'PY'
          import fast_app
          paths = {route.path for route in fast_app.app.routes}
          assert '/health' in paths
          assert '/api/resolve' in paths
          assert '/api/resolve-fast' in paths
          print('FastAPI routes OK')
          PY

      - name: Unit tests
        env:
          PYTHONPATH: backend
        run: pytest -q

      - name: JavaScript syntax
        run: node --check assets/app.js

      - name: Frontend contract
        run: |
          test -s index.html
          test -s assets/app.css
          test -s assets/app.js
          grep -q 'Google Play APK Downloader' index.html
          grep -q '/api/resolve-fast' assets/app.js
          grep -q 'playDownloaderBackend' assets/app.js

      - name: Docker Compose contract
        run: |
          cp backend/.env.example backend/.env
          docker compose config -q
          rm -f backend/.env

      - name: Dockerfile contract
        run: |
          grep -q 'COPY app.py fast_app.py' backend/Dockerfile
          grep -q 'fast_app:app' backend/Dockerfile
          bash -n backend/install-apkeditor.sh

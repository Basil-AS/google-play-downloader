name: Import Google Play Downloader

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Import prepared project tree
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch agent/google-play-downloader \
            https://github.com/Basil-AS/rustore-downloader.git /tmp/google-play-source
          rsync -a --delete --exclude='.git' /tmp/google-play-source/ ./

          # This new repository was created with master as its default branch.
          sed -i 's/branches: \[main\]/branches: [master]/' .github/workflows/pages.yml
          sed -i 's/pushes to `main` deploy the frontend automatically\./pushes to `master` deploy the frontend automatically./' README.md

          # Do not keep the one-shot importer in the final repository.
          rm -f .github/workflows/import-project.yml .bootstrap

      - name: Verify imported tree
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile backend/app.py
          node --check assets/app.js
          bash -n backend/install-apkeditor.sh
          test -s index.html
          test -s assets/app.css
          test -s assets/app.js
          grep -q 'branches: \[master\]' .github/workflows/pages.yml
          ! test -e .bootstrap
          ! test -e .github/workflows/import-project.yml

      - name: Commit final project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: import full Google Play downloader [import-complete]'
          git push origin HEAD:master

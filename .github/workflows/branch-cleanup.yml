name: Branch cleanup

on:
  push:
    branches: [master]
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  cleanup:
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Delete stale and merged branches
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          MERGED_HEAD: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          branches=("trigger/import-project" "chore/activate-pages")
          if [[ "$EVENT_NAME" == "pull_request" && -n "${MERGED_HEAD:-}" ]]; then
            branches+=("$MERGED_HEAD")
          fi

          for branch in "${branches[@]}"; do
            [[ -z "$branch" || "$branch" == "master" ]] && continue
            echo "Removing branch: $branch"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}" >/dev/null 2>&1 || true
          done

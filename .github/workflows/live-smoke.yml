name: Live Google Play smoke

on:
  push:
    branches: [master]
    paths:
      - scripts/live-smoke.mjs
      - .github/workflows/live-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check deployed Worker shell
        run: |
          curl --fail --show-error --location --max-time 20 https://google-play-downloader.basil-as.workers.dev/ -o /tmp/index.html
          grep -q "Google Play APK Downloader" /tmp/index.html
      - name: Check Worker API is constrained
        run: |
          code="$(curl -sS -o /tmp/body -w '%{http_code}' --max-time 20 'https://google-play-downloader.basil-as.workers.dev/api/download?url=https%3A%2F%2Fexample.com%2Ffile.apk')"
          test "$code" = "403"
      - name: Resolve real Google Play delivery URLs
        run: node scripts/live-smoke.mjs
